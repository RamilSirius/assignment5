<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Mentor reviewing a student's code with inline comments on screen</title>
  <rect width="400" height="300" fill="#2f2a77"/>
  <circle cx="44" cy="262" r="62" fill="#5b54c9" opacity="0.45"/>

  <!-- editor window -->
  <rect x="42" y="40" width="250" height="188" rx="10" fill="#1b1a44"/>
  <rect x="42" y="40" width="250" height="26" rx="10" fill="#413c9e"/>
  <circle cx="60" cy="53" r="5" fill="#f2a33c"/>
  <circle cx="76" cy="53" r="5" fill="#16a394"/>

  <g font-family="Consolas, monospace" font-size="13">
    <text x="60" y="92" fill="#5b54c9">1</text><text x="80" y="92" fill="#f2a33c">.card-row</text><text x="152" y="92" fill="#ffffff">{</text>
    <text x="60" y="114" fill="#5b54c9">2</text><text x="92" y="114" fill="#16a394">display</text><text x="148" y="114" fill="#ffffff">: flex;</text>
    <text x="60" y="136" fill="#5b54c9">3</text><text x="92" y="136" fill="#16a394">gap</text><text x="124" y="136" fill="#ffffff">: 1.5rem;</text>
    <text x="60" y="158" fill="#5b54c9">4</text><text x="80" y="158" fill="#ffffff">}</text>
  </g>

  <!-- changed-line markers -->
  <rect x="48" y="102" width="4" height="16" rx="2" fill="#16a394"/>
  <rect x="48" y="124" width="4" height="16" rx="2" fill="#16a394"/>

  <!-- review comment bubble -->
  <rect x="196" y="164" width="160" height="60" rx="12" fill="#ffffff"/>
  <path d="M216 224 l4 20 l20 -20 z" fill="#ffffff"/>
  <rect x="212" y="180" width="94" height="8" rx="4" fill="#2f2a77"/>
  <rect x="212" y="196" width="122" height="7" rx="3.5" fill="#dcdaf2"/>
  <circle cx="340" cy="196" r="10" fill="#f2a33c"/>

  <!-- mentor avatar -->
  <circle cx="336" cy="82" r="30" fill="#f2a33c"/>
  <circle cx="336" cy="74" r="14" fill="#ffe0b8"/>
  <path d="M336 92 c-14 0 -24 8 -24 19 v1 h48 v-1 c0 -11 -10 -19 -24 -19 z" fill="#ffffff"/>
</svg>
