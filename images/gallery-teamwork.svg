<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Team of three students planning a group project around a table</title>
  <rect width="400" height="300" fill="#efeefc"/>
  <circle cx="200" cy="40" r="56" fill="#5b54c9" opacity="0.14"/>

  <!-- round table seen from above -->
  <ellipse cx="200" cy="208" rx="150" ry="62" fill="#2f2a77"/>
  <ellipse cx="200" cy="200" rx="150" ry="62" fill="#413c9e"/>

  <!-- papers and laptop on the table -->
  <rect x="140" y="176" width="52" height="38" rx="3" fill="#ffffff" transform="rotate(-8 166 195)"/>
  <rect x="148" y="186" width="30" height="4" rx="2" fill="#dcdaf2" transform="rotate(-8 163 188)"/>
  <rect x="148" y="196" width="24" height="4" rx="2" fill="#dcdaf2" transform="rotate(-8 160 198)"/>
  <rect x="210" y="180" width="62" height="34" rx="4" fill="#16a394" transform="rotate(6 241 197)"/>
  <rect x="100" y="204" width="34" height="18" rx="4" fill="#f2a33c"/>

  <!-- three students around it -->
  <g>
    <circle cx="86" cy="130" r="26" fill="#ffe0b8"/>
    <path d="M60 128 a26 26 0 0 1 52 0 c0 -18 -12 -28 -26 -28 s-26 10 -26 28 z" fill="#3a2a18"/>
    <path d="M86 158 c-24 0 -42 14 -42 34 v16 h84 v-16 c0 -20 -18 -34 -42 -34 z" fill="#f2a33c"/>
  </g>
  <g>
    <circle cx="200" cy="106" r="28" fill="#f6d3ae"/>
    <path d="M172 110 c-4 -34 12 -50 28 -50 s32 16 28 50 c-8 -6 -10 -20 -10 -30 c-12 8 -36 8 -46 0 c0 10 -2 24 -10 30 z" fill="#241a10"/>
    <path d="M200 136 c-26 0 -46 15 -46 36 v14 h92 v-14 c0 -21 -20 -36 -46 -36 z" fill="#16a394"/>
  </g>
  <g>
    <circle cx="314" cy="130" r="26" fill="#f9dcc0"/>
    <path d="M288 134 a26 26 0 0 1 52 0 c0 -20 -12 -32 -26 -32 s-26 12 -26 32 z" fill="#5a2f1a"/>
    <path d="M314 158 c-24 0 -42 14 -42 34 v16 h84 v-16 c0 -20 -18 -34 -42 -34 z" fill="#5b54c9"/>
  </g>

  <!-- idea bubbles -->
  <circle cx="252" cy="58" r="13" fill="#ffffff" stroke="#c9c6ea" stroke-width="2"/>
  <circle cx="274" cy="42" r="9" fill="#ffffff" stroke="#c9c6ea" stroke-width="2"/>
  <circle cx="290" cy="30" r="6" fill="#f2a33c"/>
</svg>
