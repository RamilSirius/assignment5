<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img">
  <title>Student learning online with a laptop and floating course cards</title>
  <defs>
    <linearGradient id="skyHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efeefc"/>
      <stop offset="100%" stop-color="#dedcf6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="440" rx="24" fill="url(#skyHero)"/>

  <!-- decorative circles -->
  <circle cx="88" cy="82" r="46" fill="#5b54c9" opacity="0.16"/>
  <circle cx="566" cy="360" r="60" fill="#16a394" opacity="0.14"/>
  <circle cx="540" cy="70" r="18" fill="#f2a33c" opacity="0.55"/>

  <!-- desk -->
  <rect x="130" y="330" width="380" height="14" rx="7" fill="#2f2a77" opacity="0.85"/>

  <!-- laptop -->
  <rect x="216" y="188" width="208" height="132" rx="10" fill="#2f2a77"/>
  <rect x="228" y="200" width="184" height="108" rx="6" fill="#ffffff"/>
  <rect x="242" y="216" width="86" height="10" rx="5" fill="#5b54c9"/>
  <rect x="242" y="236" width="140" height="8" rx="4" fill="#d9d7f1"/>
  <rect x="242" y="252" width="120" height="8" rx="4" fill="#d9d7f1"/>
  <rect x="242" y="274" width="64" height="20" rx="10" fill="#f2a33c"/>
  <rect x="186" y="320" width="268" height="12" rx="6" fill="#413c9e"/>

  <!-- student -->
  <circle cx="320" cy="120" r="38" fill="#f2a33c"/>
  <path d="M282 148 h76 v34 a38 38 0 0 1 -76 0 z" fill="#16a394" opacity="0"/>
  <path d="M320 160 c-34 0 -58 18 -58 42 h116 c0 -24 -24 -42 -58 -42 z" fill="#16a394"/>

  <!-- floating cards -->
  <g>
    <rect x="60" y="168" width="118" height="78" rx="12" fill="#ffffff" stroke="#cfcdee" stroke-width="2"/>
    <rect x="74" y="184" width="52" height="9" rx="4" fill="#2f2a77"/>
    <rect x="74" y="201" width="82" height="7" rx="3" fill="#dcdaf2"/>
    <rect x="74" y="215" width="68" height="7" rx="3" fill="#dcdaf2"/>
    <circle cx="152" cy="230" r="10" fill="#f2a33c"/>
  </g>
  <g>
    <rect x="462" y="140" width="118" height="78" rx="12" fill="#ffffff" stroke="#cfcdee" stroke-width="2"/>
    <rect x="476" y="156" width="60" height="9" rx="4" fill="#16a394"/>
    <rect x="476" y="173" width="84" height="7" rx="3" fill="#dcdaf2"/>
    <rect x="476" y="187" width="56" height="7" rx="3" fill="#dcdaf2"/>
    <circle cx="556" cy="202" r="10" fill="#5b54c9"/>
  </g>

  <!-- progress bar -->
  <rect x="200" y="372" width="240" height="16" rx="8" fill="#ffffff"/>
  <rect x="200" y="372" width="158" height="16" rx="8" fill="#16a394"/>
</svg>
