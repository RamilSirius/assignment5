<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>Student study lounge with a sofa, laptop and plants</title>
  <rect width="400" height="300" fill="#efeefc"/>
  <rect x="0" y="236" width="400" height="64" fill="#dcdaf2"/>

  <!-- wall art -->
  <rect x="42" y="36" width="72" height="56" rx="4" fill="#ffffff" stroke="#c9c6ea" stroke-width="3"/>
  <path d="M52 82 l18 -24 l14 16 l10 -12 l10 20 z" fill="#16a394"/>
  <rect x="128" y="46" width="52" height="46" rx="4" fill="#ffffff" stroke="#c9c6ea" stroke-width="3"/>
  <circle cx="154" cy="69" r="13" fill="#f2a33c"/>

  <!-- sofa -->
  <rect x="34" y="150" width="212" height="60" rx="14" fill="#5b54c9"/>
  <rect x="44" y="132" width="192" height="40" rx="12" fill="#413c9e"/>
  <rect x="66" y="142" width="70" height="34" rx="8" fill="#f2a33c"/>
  <rect x="148" y="142" width="70" height="34" rx="8" fill="#16a394"/>
  <rect x="26" y="150" width="20" height="62" rx="10" fill="#413c9e"/>
  <rect x="234" y="150" width="20" height="62" rx="10" fill="#413c9e"/>
  <rect x="52" y="210" width="12" height="28" rx="6" fill="#2f2a77"/>
  <rect x="216" y="210" width="12" height="28" rx="6" fill="#2f2a77"/>

  <!-- coffee table + laptop -->
  <rect x="96" y="222" width="110" height="10" rx="5" fill="#2f2a77"/>
  <rect x="118" y="196" width="66" height="30" rx="4" fill="#ffffff" stroke="#c9c6ea" stroke-width="2"/>
  <rect x="126" y="204" width="34" height="5" rx="2.5" fill="#5b54c9"/>
  <rect x="126" y="214" width="44" height="4" rx="2" fill="#dcdaf2"/>

  <!-- plant -->
  <rect x="300" y="196" width="54" height="52" rx="8" fill="#f2a33c"/>
  <path d="M327 196 v-58" stroke="#16a394" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="300" cy="158" rx="24" ry="13" fill="#16a394" transform="rotate(-28 300 158)"/>
  <ellipse cx="352" cy="168" rx="22" ry="12" fill="#16a394" transform="rotate(26 352 168)"/>
  <ellipse cx="310" cy="128" rx="20" ry="11" fill="#16a394" transform="rotate(-12 310 128)"/>

  <!-- floor lamp -->
  <path d="M262 86 h44 l-8 26 h-28 z" fill="#f2a33c"/>
  <line x1="284" y1="112" x2="284" y2="238" stroke="#2f2a77" stroke-width="5"/>
</svg>
