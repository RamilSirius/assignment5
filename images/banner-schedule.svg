<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img">
  <title>Weekly calendar grid with a clock showing live class times</title>
  <rect width="960" height="280" rx="20" fill="#16a394"/>
  <circle cx="850" cy="60" r="70" fill="#ffffff" opacity="0.18"/>
  <circle cx="90" cy="230" r="56" fill="#2f2a77" opacity="0.25"/>

  <!-- calendar -->
  <rect x="90" y="50" width="300" height="190" rx="14" fill="#ffffff"/>
  <rect x="90" y="50" width="300" height="40" rx="14" fill="#2f2a77"/>
  <circle cx="140" cy="70" r="7" fill="#f2a33c"/>
  <circle cx="164" cy="70" r="7" fill="#ffffff" opacity="0.7"/>
  <g fill="#dcdaf2">
    <rect x="110" y="106" width="46" height="26" rx="5"/>
    <rect x="166" y="106" width="46" height="26" rx="5"/>
    <rect x="222" y="106" width="46" height="26" rx="5"/>
    <rect x="278" y="106" width="46" height="26" rx="5"/>
    <rect x="110" y="142" width="46" height="26" rx="5"/>
    <rect x="222" y="142" width="46" height="26" rx="5"/>
    <rect x="278" y="142" width="46" height="26" rx="5"/>
    <rect x="110" y="178" width="46" height="26" rx="5"/>
    <rect x="166" y="178" width="46" height="26" rx="5"/>
    <rect x="278" y="178" width="46" height="26" rx="5"/>
  </g>
  <rect x="166" y="142" width="46" height="26" rx="5" fill="#f2a33c"/>
  <rect x="222" y="178" width="46" height="26" rx="5" fill="#5b54c9"/>

  <!-- clock -->
  <circle cx="560" cy="140" r="74" fill="#ffffff"/>
  <circle cx="560" cy="140" r="62" fill="none" stroke="#2f2a77" stroke-width="6"/>
  <line x1="560" y1="140" x2="560" y2="98" stroke="#2f2a77" stroke-width="7" stroke-linecap="round"/>
  <line x1="560" y1="140" x2="594" y2="156" stroke="#f2a33c" stroke-width="7" stroke-linecap="round"/>
  <circle cx="560" cy="140" r="7" fill="#f2a33c"/>

  <!-- bars -->
  <rect x="690" y="170" width="30" height="60" rx="6" fill="#ffffff" opacity="0.8"/>
  <rect x="734" y="140" width="30" height="90" rx="6" fill="#ffffff" opacity="0.6"/>
  <rect x="778" y="112" width="30" height="118" rx="6" fill="#f2a33c"/>
  <rect x="822" y="152" width="30" height="78" rx="6" fill="#ffffff" opacity="0.6"/>
</svg>
