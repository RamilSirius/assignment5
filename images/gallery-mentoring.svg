<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img">
  <title>One-to-one mentoring call between a mentor and a student</title>
  <rect width="400" height="300" fill="#d6f1ec"/>
  <circle cx="44" cy="52" r="58" fill="#16a394" opacity="0.28"/>
  <circle cx="356" cy="258" r="62" fill="#5b54c9" opacity="0.22"/>

  <!-- video call window -->
  <rect x="46" y="48" width="308" height="180" rx="12" fill="#2f2a77"/>
  <rect x="46" y="48" width="308" height="28" rx="12" fill="#413c9e"/>
  <circle cx="66" cy="62" r="5" fill="#f2a33c"/>
  <circle cx="82" cy="62" r="5" fill="#16a394"/>
  <rect x="150" y="57" width="100" height="10" rx="5" fill="#5b54c9"/>

  <!-- mentor tile -->
  <rect x="62" y="88" width="132" height="124" rx="8" fill="#efeefc"/>
  <circle cx="128" cy="138" r="26" fill="#f6d3ae"/>
  <path d="M102 136 a26 26 0 0 1 52 0 c0 -18 -12 -28 -26 -28 s-26 10 -26 28 z" fill="#4a3520"/>
  <rect x="110" y="128" width="16" height="12" rx="4" fill="none" stroke="#2f2a77" stroke-width="3"/>
  <rect x="130" y="128" width="16" height="12" rx="4" fill="none" stroke="#2f2a77" stroke-width="3"/>
  <path d="M128 168 c-22 0 -38 13 -38 30 v14 h76 v-14 c0 -17 -16 -30 -38 -30 z" fill="#16a394"/>

  <!-- student tile -->
  <rect x="206" y="88" width="132" height="124" rx="8" fill="#dcdaf2"/>
  <circle cx="272" cy="138" r="26" fill="#ffe0b8"/>
  <path d="M246 142 c-4 -32 12 -48 26 -48 s30 16 26 48 c-8 -6 -10 -18 -10 -28 c-10 8 -32 8 -42 0 c0 10 -2 22 -10 28 z" fill="#241a10"/>
  <path d="M272 168 c-22 0 -38 13 -38 30 v14 h76 v-14 c0 -17 -16 -30 -38 -30 z" fill="#f2a33c"/>

  <!-- call controls -->
  <circle cx="170" cy="256" r="20" fill="#ffffff"/>
  <path d="M162 250 h16 v12 h-16 z" fill="#2f2a77"/>
  <circle cx="230" cy="256" r="20" fill="#f2a33c"/>
  <path d="M222 248 l16 8 l-16 8 z" fill="#ffffff"/>
</svg>
