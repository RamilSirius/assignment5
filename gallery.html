<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap-theme.css">
    <link rel="stylesheet" href="css/interactive.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-edu border-bottom border-3 border-warning py-2" data-bs-theme="dark" aria-label="Main navigation">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
          <img src="images/logo.svg" alt="EduSphere logo: a graduation cap inside a circle" width="44" height="44">
          <span class="d-flex flex-column lh-1">
            <span class="fs-4 fw-bold font-serif">EduSphere</span>
            <small class="text-warning text-uppercase brand-tagline mt-1">Learn · Practise · Grow</small>
          </span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2 fw-semibold py-3 py-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="courses.html">Courses</a></li>
            <li class="nav-item"><a class="nav-link" href="instructors.html">Instructors</a></li>
            <li class="nav-item"><a class="nav-link" href="schedule.html">Schedule</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
            <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
              <a class="btn btn-warning fw-semibold px-3 shadow-sm" href="contact.html">Contact</a>
            </li>
            <li class="nav-item ms-lg-1 mt-2 mt-lg-0">
              <!-- ASSIGNMENT #5: Day / Night theme switch (js/main.js) -->
              <button id="theme-toggle" class="btn btn-outline-light btn-sm" type="button" aria-label="Switch to night theme">🌙</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
    <main>
        
        <section>
            <!-- Task 7: carousel placed in the Bootstrap grid (container > row > col) -->
            <div class="container py-4">
              <div class="row">
                <div class="col-lg-10 mx-auto">
                  <div id="galleryCarousel" class="carousel slide" data-bs-ride="carousel">

                      <div class="carousel-inner">
                          <div class="carousel-item active">
                              <img src="images/gallery-lecture.svg" class="d-block w-100" alt="Live class">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-codereview.svg" class="d-block w-100" alt="Code review">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-hackathon.svg" class="d-block w-100" alt="Hackathon">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-whiteboard.svg" class="d-block w-100" alt="Flexbox workshop">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-mentoring.svg" class="d-block w-100" alt="One-to-one mentoring">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-teamwork.svg" class="d-block w-100" alt="Team project">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-lounge.svg" class="d-block w-100" alt="Study lounge">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-library.svg" class="d-block w-100" alt="Campus library">
                          </div>
                          <div class="carousel-item">
                              <img src="images/gallery-workshop.svg" class="d-block w-100" alt="Open lecture">
                          </div>
                      </div>

                      <a class="carousel-control-prev" href="#galleryCarousel" data-bs-slide="prev" role="button" aria-label="Previous slide">
                          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                      </a>
                      <a class="carousel-control-next" href="#galleryCarousel" data-bs-slide="next" role="button" aria-label="Next slide">
                          <span class="carousel-control-next-icon" aria-hidden="true"></span>
                      </a>

                      <div class="carousel-indicators">
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="4" aria-label="Slide 5"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="5" aria-label="Slide 6"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="6" aria-label="Slide 7"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="7" aria-label="Slide 8"></button>
                          <button type="button" data-bs-target="#galleryCarousel" data-bs-slide-to="8" aria-label="Slide 9"></button>

                      </div>
                  </div>
                </div>
              </div>
            </div>
        </section>


    </main>
    <footer class="bg-dark text-white text-center py-3 mt-4">
  <div class="container">
    <p class="mb-0">&copy; 2026 EduSphere · The Ethernet — Group SE-2510 · Ramil Zhunussov, Maxim Batyushkin, Azamat Mustafin</p>
    <p class="text-success">Give us hundred please</p>
  </div>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>

</html>
